<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokémon Red Viewer</title>
<style>
  :root {
    --bg: #f4f4ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2f6f4f; --bar: #cfe3d6; --warn: #b4462f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecece6; --muted: #9a9a92; --line: #33332f; --accent: #7cc49b; --bar: #2c4a39; --warn: #e38a73; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 6px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .pill { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(320px, 480px) 1fr; gap: 16px; padding: 8px 16px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  canvas { width: 100%; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; aspect-ratio: 160/144; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .party { display: grid; gap: 6px; margin-top: 6px; }
  .mon { display: grid; grid-template-columns: 1fr 90px 60px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
  .hp { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .hp i { display: block; height: 100%; background: var(--accent); }
  .side { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev { font-size: 12px; color: var(--muted); }
  .ev.bot { color: var(--ink); }
  .ev.jev { color: var(--accent); }
  .ev.save { color: var(--accent); font-weight: 600; }
  .ev.error { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Pokémon Red</h1>
  <span class="pill" id="conn">connecting…</span>
  <span class="pill" id="bot" hidden></span>
  <span class="pill" id="jev" hidden></span>
</header>
<main>
  <section>
    <div class="card">
      <canvas id="screen" width="160" height="144"></canvas>
      <div class="row">
        <button id="pause">Pause / resume</button>
        <button id="save">Save state</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="badges">0</b><span>badges</span></div>
        <div class="stat"><b id="money">0</b><span>money</span></div>
        <div class="stat"><b id="frames">0</b><span>frames</span></div>
        <div class="stat"><b id="state">—</b><span>state</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="label">Location</div>
      <div id="loc">—</div>
      <div class="label" style="margin-top:10px">Party</div>
      <div class="party" id="party"></div>
    </div>
  </section>
  <section class="side">
    <div class="card">
      <div class="label">Events</div>
      <div id="events" style="max-height: 70vh; overflow-y: auto"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const ctx = $('screen').getContext('2d');
const img = ctx.createImageData(160, 144);
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (m) => {
    if (m.data instanceof ArrayBuffer) {
      const px = new Uint8Array(m.data);
      img.data.set(px.subarray(0, img.data.length));
      for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
      ctx.putImageData(img, 0, 0);
      return;
    }
    const msg = JSON.parse(m.data);
    if (msg.type === 'status') status(msg);
    else if (msg.type === 'event') event(msg.e);
    else if (msg.type === 'history') msg.events.forEach(event);
  };
  ws.onopen = () => { $('conn').textContent = 'connected'; };
  ws.onclose = () => { $('conn').textContent = 'disconnected'; setTimeout(connect, 1000); };
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function status(s) {
  $('badges').textContent = s.badges; $('money').textContent = `¥${s.money.toLocaleString()}`;
  $('frames').textContent = s.frames.toLocaleString(); $('state').textContent = s.paused ? 'paused' : 'running';
  $('loc').textContent = `${s.map} (${s.x}, ${s.y})`;
  if (s.bot) {
    $('bot').hidden = false;
    $('bot').textContent = `bot: ${s.bot.status}${s.bot.run ? ` · run ${s.bot.run}` : ''}`;
    $('bot').style.color = s.bot.status === 'error' ? 'var(--warn)' : s.bot.status === 'running' ? 'var(--accent)' : '';
    $('bot').title = s.bot.error ?? '';
  }
  if (s.jev) {
    $('jev').hidden = false;
    $('jev').textContent = s.jev.available ? `jev: ${s.jev.calls} calls · $${s.jev.costUsd.toFixed(4)}` : 'jev: off';
    $('jev').title = s.jev.model;
  }
  $('party').innerHTML = s.party.map((p) => `<div class="mon"><div>${esc(p.name)} <span class="num">${esc(p.species)} Lv${p.level}</span></div>
    <div class="hp"><i style="width:${Math.round(100 * p.hp / Math.max(1, p.maxHp))}%"></i></div><div class="num">${p.hp}/${p.maxHp}</div></div>`).join('') || '<span class="ev">none yet</span>';
}
function event(e) {
  const el = document.createElement('div');
  el.className = `ev ${e.kind}`;
  el.textContent = `[${e.kind}] ${e.msg}`;
  $('events').prepend(el);
  while ($('events').children.length > 120) $('events').lastChild.remove();
}
$('pause').onclick = () => ws.send(JSON.stringify({ cmd: 'pause' }));
$('save').onclick = () => ws.send(JSON.stringify({ cmd: 'save' }));
connect();
</script>
</body>
</html>
